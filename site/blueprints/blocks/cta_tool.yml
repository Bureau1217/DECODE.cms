blueprint: block
name: Appel d'un outil
icon: check
preview: fields
wysiwyg: true

fields:
  title:
    type: writer
    label: Titre
    inline: true
    width: 1/2
    nodes:
      - paragraph
    marks:
      - italic
    help: Titre de la section

  tool:
    type: checkboxes
    label: Outil
    help: Outil gérées dans la section 'outil' de l'administration du site
    options:
      type: query
      query: site.tools.toStructure
      text: "{{ item.name }}"
      value: "{{ item.name }}"

  help:
    type: info
    text: Ce block ne contient aucun champ éditable. Il sert uniquement de point d'ancrage pour afficher dynamiquement un des outils en front.
