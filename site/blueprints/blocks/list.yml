blueprint: block
name: List
icon: list-bullet
preview: fields
wysiwyg: true

fields:
  title:
    type: writer
    label: Titre
    inline: true
    width: 1/2
    nodes:
      - paragraph
    marks:
      - italic
    help: Titre de la section

  items:
    label: Items
    type: structure
    fields:
      title:
        label: Titre
        type: text
      image:
        label: Image
        type: files
        multiple: false
        query: page.images
        uploads: true
      link:
        label: Lien
        type: url
      text:
        label: Texte
        type: writer
