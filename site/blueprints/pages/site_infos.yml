blueprint: page

title: Site Infos

columns:
  main:
    width: 2/3
    sections:
      header:
        type: fields
        fields:
          sentences:
            type: structure
            label: Titres du splash screen
            help: "Une entrée par titre : le splash passe de l'un à l'autre environ toutes les 5 secondes. Le texte s'adapte à l'écran."
            fields:
              sentence:
                type: textarea
                label: Titre
                buttons: false
                size: small
                help: "Chaque retour à la ligne crée une ligne à l'écran. Sans retour à la ligne, chaque mot est sur sa propre ligne."

          header_subtitle:
            type: textarea
            label: Sous-titre
            buttons: false
            size: small
            help: "Chaque retour à la ligne crée une ligne à l'écran."

      home:
        type: fields
        fields:
          home_headline:
            type: structure
            label: Titre de la page d'accueil
            help: Une ligne par entrée (affichées l'une sous l'autre, à droite de l'index).
            fields:
              line:
                type: text
                label: Ligne

          home_subtitle:
            type: writer
            label: Sous-titre de la page d'accueil
            inline: true
            marks: false

      infos:
        type: fields
        fields:
          long_description:
            type: writer
            label: Description courte
            inline: true
            marks: false

          informations:
            type: writer
            label: Texte de l'onglet (haut à gauche)
            inline: true
            marks: false
