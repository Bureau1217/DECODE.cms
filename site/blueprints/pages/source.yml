blueprint: page

title: Source

icon: url

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          source_domain:
            type: text
            label: Domaine
            required: true
            help: "Ex. : bbc.com — c'est ce que l'extension utilise pour reconnaître la source."

          source_type:
            type: select
            label: Type
            options:
              'News organisation': News organisation
              'Public broadcaster': Public broadcaster
              'Government / institution': Government / institution
              'NGO / civil society': NGO / civil society
              'Academic / research': Academic / research
              'Platform / social media': Platform / social media
              'Blog / personal site': Blog / personal site
              'Satirical source': Satirical source
              'Unknown / other': Unknown / other

          country_or_region:
            type: text
            label: Pays / région
            required: true

          topic_area:
            type: select
            label: Thématique
            options:
              'General news': General news
              'Politics': Politics
              'International affairs': International affairs
              'Economy': Economy
              'Science / health': Science / health
              'Culture': Culture
              'Local news': Local news
              'Opinion / commentary': Opinion / commentary
              'Other': Other

          trust_score_explanation:
            type: textarea
            label: Explication du score

          bias_notes:
            type: textarea
            label: Notes sur le biais

      evidence:
        label: Preuves
        type: fields
        fields:
          authority_sources:
            type: text
            label: Source de référence (URL)

          ownership_funding:
            type: textarea
            label: Propriété / financement

  sidebar:
    width: 1/3
    sections:
      score:
        type: fields
        fields:
          trust_score_100:
            type: range
            label: Score de confiance
            min: 0
            max: 100
            step: 5
            default: 50

          trust_level:
            type: select
            label: Niveau de confiance
            options:
              'Very high': Very high
              'High': High
              'Medium': Medium
              'Low': Low
              'Very low': Very low
              'Unclear': Unclear
