blueprint: page

title: Page

columns:
  main:
    width: 2/3
    sections:
      header:
        type: fields
        fields:
          header_title:
            label: Titre header
            type: text
            help: Titre affiché dans le header (le titre de la page est utilisé si vide)
          header_subtitle:
            label: Sous-titre header
            type: text
          header_image:
            label: Image header
            type: files
            multiple: false
            query: page.images
            uploads: true


      contenu:
        type: fields
        fields:
          contenu:
            label: Contenu
            type: blocks
            fieldsets:
              - gallery
              - list
              - testimonials
              - toggle
              - text
              - formations
              - concerts-event

  sidebar:
    width: 1/3
    sections:
      subpage:
        label: Sous-pages
        type: pages
        template: default
