blueprint: page

title: Page

columns:
  main:
    width: 2/3
    sections:
      header:
        type: fields
        fields:
          header_title:
            label: Titre header
            type: text
            help: Titre affiché dans le header (le titre de la page est utilisé si vide)
          header_subtitle:
            label: Sous-titre header
            type: text
          header_image:
            label: Image header
            type: files
            multiple: false
            query: page.images
            uploads: true
            width: 2/3
          page_image_preview:
            type: files
            label: Image d'aperçu
            help: Image affichée si on appelle cette page depuis une autre
            multiple: false
            query: page.images
            uploads: true
            width: 1/3



      main:
        type: fields
        fields:
          content:
            extends: fields/blocks_all
            label: Contenu
            fieldsets:
              section: true
              array-layout : true

  sidebar:
    width: 1/3
    sections:
      subpage:
        label: Sous-pages
        type: pages
        template: default
      themes_section:
        type: fields
        fields:
          themes:
            type: checkboxes
            label: Thématiques
            help: Thématiques gérées dans les réglages du site
            options:
              type: query
              query: site.themes.toStructure
              text: "{{ item.name }}"
              value: "{{ item.name }}"

