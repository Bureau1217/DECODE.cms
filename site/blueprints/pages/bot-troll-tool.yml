blueprint: page

title: Site Infos

columns:
  main:
    width: 2/3
    sections:
      image:
        type: fields
        fields:
          subtitle:
            type: text
            label: Sous-titre

          description:
            type: writer
            label: Déscription
            nodes:
              - paragraph
            marks:
              - italic

          image:
            extends: fields/image
            layout: cards
            size: large


          url:
            label: URL
            type: url

      keywords_section:
        type: fields
        fields:
          themes:
            type: pages
            label: Thèmes
            help: Mots-clés gérés dans les réglages du site
            query: site.find('themes').children.filterBy('intendedTemplate', 'tag')
          concepts:
            type: pages
            label: Concepts
            help: Mots-clés gérés dans les réglages du site
            query: site.find('concepts').children.filterBy('intendedTemplate', 'tag')
          platforms:
            type: pages
            label: Plateformes
            help: Mots-clés gérés dans les réglages du site
            query: site.find('platforms').children.filterBy('intendedTemplate', 'tag')
          questions:
            type: pages
            label: Questions
            help: Mots-clés gérés dans les réglages du site
            query: site.find('question').children.filterBy('intendedTemplate', 'tag')

  sidebar:
    width: 1/3
    sections:
      criteria:
        label: Critères
        help: La liste de critères affichée dans l'outil.
        type: pages
        template: criterion
        layout: list

      submissions:
        label: Soumissions (verdicts des visiteurs)
        help: Lecture seule — chaque soumission est créée automatiquement quand un·e visiteur·se enregistre un verdict dans l'outil.
        type: pages
        template: submission
        layout: table
        columns:
          account_handle:
            label: Compte
          verdict:
            label: Verdict
          confidence:
            label: Confiance
          reviewed_at:
            label: Soumis le
