blueprint: page

title: Site Infos

tabs:
  content:
    label: Contenu
    icon: text
    columns:
      main:
        width: 2/3
        sections:
          image:
            type: fields
            fields:
              subtitle:
                type: text
                label: Sous-titre

              description:
                type: writer
                label: Déscription
                nodes:
                  - paragraph
                marks:
                  - italic

              credits: fields/credits

              image:
                extends: fields/image
                layout: cards
                size: large


              url:
                label: URL
                type: url

          keywords_section:
            type: fields
            fields:
              themes:
                type: pages
                label: Thèmes
                help: Mots-clés gérés dans les réglages du site
                query: site.find('themes').children.filterBy('intendedTemplate', 'tag')
              concepts:
                type: pages
                label: Concepts
                help: Mots-clés gérés dans les réglages du site
                query: site.find('concepts').children.filterBy('intendedTemplate', 'tag')
              platforms:
                type: pages
                label: Plateformes
                help: Mots-clés gérés dans les réglages du site
                query: site.find('platforms').children.filterBy('intendedTemplate', 'tag')
              questions:
                type: pages
                label: Questions
                help: Mots-clés gérés dans les réglages du site
                query: site.find('question').children.filterBy('intendedTemplate', 'tag')

      sidebar:
        width: 1/3
        sections:
          criteria:
            label: Critères
            help: La liste de critères affichée dans l'outil.
            type: pages
            template: criterion
            layout: list

  # Every verdict a visitor records in the tool (site/plugins/submissions
  # creates one `submission` child page per save). Read-only review table,
  # plus a CSV export of all of them for spreadsheets.
  submissions:
    label: Soumissions des visiteurs
    icon: chat-bubble
    sections:
      submissions_export:
        type: info
        label: Exporter
        theme: info
        text: |
          Chaque ligne est un verdict enregistré par un·e visiteur·se dans l'outil (compte jugé, verdict, commentaire).
          (link: submissions/bot-troll-detector.csv text: Télécharger toutes les soumissions (CSV))

      submissions:
        label: Soumissions
        type: pages
        template: submission
        status: all
        layout: table
        search: true
        sortBy: reviewed_at desc
        limit: 50
        create: false
        # The table's own title column shows the judged account.
        text: "{{ page.account_handle }}"
        columns:
          reviewed_at:
            label: Date
            width: 1/6
            value: "{{ page.reviewed_at.toDate('d/m/Y H:i') }}"
          account_platform:
            label: Plateforme
            width: 1/6
          verdict:
            label: Verdict
            width: 1/6
            value: "{{ page.verdictLabel }}"
          note:
            label: Commentaire
            width: 2/6
